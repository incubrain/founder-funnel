items:
  - label: Is this really free?
    content: Yes. MIT licensed. You own the code and the data.

  - label: What is Foundry NOT?
    content: Not a dashboard, not analytics, not email sequences, not payments. Foundry ends at the stream — interpretation belongs to whatever pulls your export.

  - label: Why trust the agent-traffic thesis?
    content: Don't — check it. The Cloudflare sources are linked above, and every Foundry site classifies its own visitors, so you'll see the shift (or its absence) in your own export.

  - label: Who runs this in production?
    content: Two of our own sites — astronera.org and incubrain.org. Nobody else yet; that's an open entry in the station log.
