type: objection
label: Technical
icon: i-lucide-code
color: warning
items:
  - label: What's the stack?
    content: Nuxt 4, Tailwind 4, TypeScript.

  - label: Where do leads go?
    content: Into a signal buffer on your own server. You pull them from `GET /api/_signals/export` with a bearer token — no third-party service sees them first.

  - label: How hard is it to customize?
    content: It's standard Vue/Nuxt. If you know the stack, you're good to go.
