items:
  - label: Do I need to be in one of the 12 sectors?
    content: Not strictly, but the 12 sectors represent where we see the greatest exponential potential. If your idea intersects with AI and has massive growth potential, we're interested.

  - label: How do you choose which sectors to focus on?
    content: We reference top futurists — Ray Kurzweil, Peter Diamandis, Amy Webb, and others — to identify sectors where AI enables abundance and extreme personalization. Updated every 6 months.

  - label: What does "abundance mindset" mean in practice?
    content: "We believe AI will handle mundane tasks, understand individual heuristics and values, and act like an executive assistant — giving everyone access to personalized, high-level options. We build toward that future."

  - label: Can I pivot between sectors?
    content: Absolutely. Early-stage validation often reveals unexpected opportunities. The mentorship program is designed to help you test and pivot quickly rather than commit prematurely.
