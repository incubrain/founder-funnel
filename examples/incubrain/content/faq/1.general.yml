items:
  - label: What is Incubrain?
    content: Incubrain is an AI-powered incubation hub for technical solopreneurs. We combine Y Combinator-style execution with an abundance mindset, practical open-source tools, and deep mentorship to help founders outperform traditional 20+ person teams.

  - label: Who is this for?
    content: Technical solopreneurs — engineers, developers, AI/ML specialists — primarily in Pune/Maharashtra, with secondary spots for international founders. You need 3+ years of technical experience and a bias toward execution.

  - label: What are the three pillars?
    content: "Foundry: prove your vision fast with marketing sites, blogs, and decision logs. Founder: your personal support system with gap analysis and plan refinement. Builder: ship real products with auth, databases, and connectors built in. All three are free and open source."

  - label: Is this a traditional accelerator?
    content: No. We don't take a batch approach. It's a rolling monthly membership with weekly meetups and 1-on-1 sessions. You join when you're ready and stay as long as you need.

  - label: What sectors do you focus on?
    content: We focus on 12 key sectors where AI can create exponential impact — from AI infrastructure and robotics to biotech, climate tech, space, cybersecurity, fintech, healthcare, manufacturing, agriculture, and more.

  - label: Why Pune?
    content: Pune offers world-class engineering talent, low cost of living, a growing startup ecosystem, and proximity to Mumbai's financial center. It's the ideal launchpad for technical founders building global products.
