type: mentorship
label: Mentorship
icon: i-lucide-users
color: warning
items:
  - label: What does the mentorship include?
    content: Weekly group meetups every Friday (in-person in Pune, hybrid for international), 1-on-1 sessions every other week, async support, accounting guidance, and a hosted version of Incubrain Founder (the support-system product).

  - label: How much does it cost?
    content: "Local founders (Pune/Maharashtra): $200 USD/month (~₹20,000). International founders: $2,000 USD/month. Single pricing tier, no discounts, no free tiers. Price only increases over time."

  - label: Why is there only one pricing tier?
    content: We focus energy on committed, high-quality founders who pay. No free tiers or discounts means every founder in the program is serious about execution. This keeps the group elite and high-signal.

  - label: How many mentees do you accept?
    content: Maximum 10 local (Pune/Maharashtra) + 10 international founders at any time. This ensures every founder gets meaningful time and attention.

  - label: What results can I expect?
    content: Save a minimum of 40 hours per month through automation, outsourcing, and intelligent systems. Gain massive clarity, better decision-making, and avoid months or years on dead-end paths.

  - label: Is there an equity component?
    content: The local track may include equity participation, handled privately during onboarding on a case-by-case basis. No further public details.

  - label: Can I cancel anytime?
    content: Yes. It's a rolling monthly membership — cancel anytime after the first month. No long-term contracts or lock-in.

  - label: What about the open-source tools?
    content: Foundry, Founder, and Builder are free for anyone to use. Mentees receive hosted versions, guided training, and 1-on-1 help on leveraging all three pillars to accelerate their vision.
