# Local-only registry config for testing layer changes in external consumers.
# Allows anonymous publish so devs don't have to `npm adduser`.
# Storage and uplinks make this safe — only @incubrain/* packages stay local;
# everything else proxies to public npm.
storage: ./.verdaccio/storage
auth:
  htpasswd:
    file: ./.verdaccio/htpasswd
    max_users: 10
listen: 0.0.0.0:4873

uplinks:
  npmjs:
    url: https://registry.npmjs.org/

packages:
  '@incubrain/*':
    access: $all
    # $all covers both anonymous and authenticated users. We auth as a
    # throwaway 'foundry-local' user because the npm client refuses to send
    # unauthenticated publish requests, even when verdaccio would accept them.
    publish: $all
    unpublish: $all
    # Don't proxy to public npm for our scoped packages — local versions win.
  '**':
    access: $all
    publish: $authenticated
    proxy: npmjs

logs:
  type: stdout
  format: pretty
  level: warn

# Pid file location so `verdaccio:stop` can find it.
self_path: ./
